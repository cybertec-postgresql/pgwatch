name: 'Setup Protobuf'
description: 'Install protoc and Go plugins with caching'

inputs:
  # The plugin versions are pinned: their output is baked into the committed
  # api/pb/*.pb.go, and the staleness check in build.yml compares against it.
  # An unpinned `@latest` silently rewrites the generated code whenever the
  # plugins release. Keep these in sync with the `tools` task in Taskfile.yml.
  protoc-gen-go-version:
    description: 'Version of protoc-gen-go to install'
    default: 'v1.36.12'
  protoc-gen-go-grpc-version:
    description: 'Version of protoc-gen-go-grpc to install'
    default: 'v1.6.2'
  protoc-version:
    description: 'Version of protoc to install'
    default: '25.x'

runs:
  using: 'composite'
  steps:
    - name: Cache protobuf tools
      uses: actions/cache@v4
      with:
        path: |
          ~/go/bin/protoc-gen-go
          ~/go/bin/protoc-gen-go-grpc
        # No restore-keys on purpose: a partial hit would restore plugins built
        # from a different version, and the install step below would skip them.
        key: ${{ runner.os }}-${{ runner.arch }}-protoc-tools-${{ inputs.protoc-gen-go-version }}-${{ inputs.protoc-gen-go-grpc-version }}

    - name: Install protoc
      uses: arduino/setup-protoc@v3
      with:
        version: ${{ inputs.protoc-version }}
        repo-token: ${{ github.token }}

    - name: Install protobuf tools
      shell: bash
      run: |
        if [ ! -x ~/go/bin/protoc-gen-go ] || [ ! -x ~/go/bin/protoc-gen-go-grpc ]; then
          go install google.golang.org/protobuf/cmd/protoc-gen-go@${{ inputs.protoc-gen-go-version }}
          go install google.golang.org/grpc/cmd/protoc-gen-go-grpc@${{ inputs.protoc-gen-go-grpc-version }}
        fi
        protoc-gen-go --version
        protoc-gen-go-grpc --version
