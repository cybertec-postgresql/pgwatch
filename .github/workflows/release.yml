name: Release

permissions:
  contents: write
  packages: write
  pages: write
  deployments: write
  pull-requests: write
  issues: write

on:
  release:
    types: [created]
      
jobs:

  goreleaser:
    if: true # false to skip job during debug
    runs-on: ubuntu-latest
    steps:

    - name: Set up Golang
      uses: actions/setup-go@v7
      with:
        go-version: '1.27'

    - name: Check out code into the Go module directory
      uses: actions/checkout@v7

    - name: Unshallow
      run: git fetch --prune --unshallow

    - name: Set up Node.js
      uses: actions/setup-node@v7
      with:
        node-version: '22'

    - name: Setup Protobuf
      uses: ./.github/actions/setup-protobuf

    - name: Generate protobuf files
      run: go generate ./api/pb/

    - name: Release via goreleaser
      uses: goreleaser/goreleaser-action@v7
      with:
        args: release
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  docker:
    name: Build and Push Docker Images
    if: true # false to skip job during debug
    strategy:
      fail-fast: false
      matrix:
        image: [ 
          {file: 'docker/Dockerfile', name: 'cybertecpostgresql/pgwatch'}, 
          {file: 'docker/demo/Dockerfile', name: 'cybertecpostgresql/pgwatch-demo'}
        ]
    runs-on: ubuntu-latest
    steps:

    - name: Check out source code
      uses: actions/checkout@v7

    - name: Prepare build metadata
      id: meta
      run: |
        echo "GIT_HASH=${{ github.sha }}" >> $GITHUB_OUTPUT
        echo "GIT_TIME=$(git show -s --format=%cI HEAD)" >> $GITHUB_OUTPUT
        echo "VERSION=${{ github.ref_name }}" >> $GITHUB_OUTPUT
        echo "SHOULD_PUSH=${{ github.ref_type == 'tag' }}" >> $GITHUB_OUTPUT

    - name: Build and push Docker image
      uses: ./.github/actions/build-docker
      with:
        dockerfile: ${{ matrix.image.file }}
        image-name: ${{ matrix.image.name }}
        registry: docker.io
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}
        platforms: linux/amd64,linux/arm64
        push: ${{ steps.meta.outputs.SHOULD_PUSH }}
        cache-scope: shared-release
        build-args: |
          GIT_HASH=${{ steps.meta.outputs.GIT_HASH }}
          GIT_TIME=${{ steps.meta.outputs.GIT_TIME }}
          VERSION=${{ steps.meta.outputs.VERSION }}      
  docs:
    name: Deploy versioned docs
    if: ${{ !github.event.release.prerelease }}
    runs-on: ubuntu-latest
    steps:

    - name: Check out tag
      uses: actions/checkout@v7

    - name: Configure Git
      run: |
        git config user.name "${GITHUB_ACTOR}"
        git config user.email "${GITHUB_ACTOR}@users.noreply.github.com"

    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: 3.12

    - name: Install dependencies
      run: pip install mike mkdocs-material mkdocs-glightbox

    - name: Deploy docs with mike
      run: |
        git fetch origin gh-pages --depth=1
        git branch gh-pages origin/gh-pages
        major="${GITHUB_REF_NAME%%.*}"   # v6.1.0 -> v6
        version="${major}.x"
        # A patch release of an older major line must not take the `latest` alias.
        newer=$(mike list --json | jq --argjson m "${major#v}" \
          '[.[].version | capture("^v(?<n>[0-9]+)") | .n | tonumber | select(. > $m)] | length')
        if [ "$newer" -eq 0 ]; then
          mike deploy --push --update-aliases "$version" latest
          mike set-default --push latest
        else
          mike deploy --push "$version"
        fi
